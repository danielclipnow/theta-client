# JitPack configuration for Kotlin Multiplatform project
# JitPack runs on Linux, so only Android and JVM targets are built
# iOS targets are conditionally excluded in build.gradle.kts when JITPACK=true

jdk:
  - openjdk17

# Pre-install steps
before_install:
  - chmod +x gradlew

# Custom install command - publish to local Maven for JitPack to pick up
install:
  - ./gradlew :kotlin-multiplatform:publishToMavenLocal --no-daemon --stacktrace
